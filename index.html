<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports League Game</title>
  
  <!-- Google Font: Cardo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* Reset and dark background setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      font-family: 'Cardo', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    /* Screen 1: Fullscreen Prompt */
    #fullscreen-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 35px;
      text-align: center;
    }

    .prompt-text {
      font-family: 'Cardo', serif;
      font-size: 48px;
      color: #0011ff;
      font-weight: normal;
    }

    .fullscreen-btn {
      font-family: 'Cardo', serif;
      font-size: 22px;
      color: #000000;
      background-color: #0011ff;
      border: 1px solid #3344ff;
      padding: 12px 32px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .fullscreen-btn:hover {
      background-color: #2233ff;
      transform: scale(1.05);
    }

    /* Screen 2: Game Board */
    #game-screen {
      display: none;
      width: 40vw;
      height: 40vh;
      cursor: pointer;
      justify-content: center;
      align-items: center;
    }

    /* CSS Grid forces fixed slot widths to prevent layout shift */
    .board-container {
      display: grid;
      grid-template-columns: repeat(6, 130px);
      gap: 25px;
      justify-content: center;
      align-items: end;
      padding: 20px;
      width: 1000%;
    }

    .slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 30px;
      width: 130px;
    }

    /* Numbers styling & off-screen drop preparation */
    .number-slot {
      height: 100px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .number-img {
      height: 90px;
      width: auto;
      object-fit: contain;
      transform: translateY(-120vh); /* Start high off-screen */
      transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.27);
    }

    .number-img.dropped {
      transform: translateY(0); /* Fall into place above logos */
    }

    /* Logos container slot */
    .logo-slot {
      height: 90px;
      width: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-img {
      height: 90px;
      max-width: 90px;
      width: auto;
      object-fit: contain;
      will-change: transform;
    }

    /* Screen 3: Correct Answer Prompt Screen */
    #answer-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
    }

    /* Screen 4: Final Black Screen */
    #black-screen {
      display: none;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }
  </style>
</head>
<body>

  <!-- Screen 1: Start Screen -->
  <div id="fullscreen-screen">
    <h1 class="prompt-text">Please enter full screen to play</h1>
    <button class="fullscreen-btn" id="start-btn">Enter full screen</button>
  </div>

  <!-- Screen 2: Main Game Screen -->
  <div id="game-screen">
    <div class="board-container">
      
      <!-- Slot 1 -->
      <div class="slot">
        <div class="number-slot">
          <img src="1.png" alt="1" class="number-img">
        </div>
        <div class="logo-slot">
          <img src="mlb.png" alt="MLB Logo" class="logo-img" data-league="mlb">
        </div>
      </div>

      <!-- Slot 2 -->
      <div class="slot">
        <div class="number-slot">
          <img src="2.png" alt="2" class="number-img">
        </div>
        <div class="logo-slot">
          <img src="mls.png" alt="MLS Logo" class="logo-img" data-league="mls">
        </div>
      </div>

      <!-- Slot 3 -->
      <div class="slot">
        <div class="number-slot">
          <img src="3.png" alt="3" class="number-img">
        </div>
        <div class="logo-slot">
          <img src="nba.png" alt="NBA Logo" class="logo-img" data-league="nba">
        </div>
      </div>

      <!-- Slot 4 (Fixed NFL Slot) -->
      <div class="slot">
        <div class="number-slot">
          <img src="4.png" alt="4" class="number-img">
        </div>
        <div class="logo-slot">
          <img src="nfl.png" alt="NFL Logo" class="logo-img" data-league="nfl">
        </div>
      </div>

      <!-- Slot 5 -->
      <div class="slot">
        <div class="number-slot">
          <img src="5.png" alt="5" class="number-img">
        </div>
        <div class="logo-slot">
          <img src="nhl.png" alt="NHL Logo" class="logo-img" data-league="nhl">
        </div>
      </div>

      <!-- Slot 6 -->
      <div class="slot">
        <div class="number-slot">
          <img src="6.png" alt="6" class="number-img">
        </div>
        <div class="logo-slot">
          <img src="cfl.png" alt="CFL Logo" class="logo-img" data-league="cfl">
        </div>
      </div>

    </div>
  </div>

  <!-- Screen 3: Answer Screen -->
  <div id="answer-screen">
    <h1 class="prompt-text">Let’s see what the correct answer is</h1>
  </div>

  <!-- Screen 4: Final Black Screen -->
  <div id="black-screen"></div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const fullscreenScreen = document.getElementById('fullscreen-screen');
    const gameScreen = document.getElementById('game-screen');
    const answerScreen = document.getElementById('answer-screen');
    const blackScreen = document.getElementById('black-screen');
    
    let clickCount = 0;
    let isAnimating = false;
    let numbersAreDropped = false;
    let readyToFlyAway = false;
    let flewAway = false;

    // Fullscreen Trigger
    startBtn.addEventListener('click', () => {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
      } else if (document.documentElement.webkitRequestFullscreen) {
        document.documentElement.webkitRequestFullscreen();
      } else if (document.documentElement.msRequestFullscreen) {
        document.documentElement.msRequestFullscreen();
      }

      fullscreenScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
    });

    // Click on "Let's see what the correct answer is" to return to board
    answerScreen.addEventListener('click', () => {
      answerScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
      readyToFlyAway = true; // Prepare board for fly-away click
    });

    // Handle background clicks on the Game Screen
    gameScreen.addEventListener('click', () => {
      if (isAnimating) return;

      // Final Stage 2: Click after fly-away transitions to black screen
      if (flewAway) {
        gameScreen.style.display = 'none';
        blackScreen.style.display = 'block';
        return;
      }

      // Final Stage 1: Fly away all numbers and logos except Number 4 and NFL
      if (readyToFlyAway) {
        flewAway = true;
        isAnimating = true;

        const allNumbers = document.querySelectorAll('.number-img');
        const allLogos = document.querySelectorAll('.logo-img');

        // Animate numbers flying UP (except 4)
        allNumbers.forEach(num => {
          if (num.getAttribute('alt') !== '4') {
            num.animate([
              { transform: 'translateY(0)', opacity: 1 },
              { transform: 'translateY(-120vh)', opacity: 0 }
            ], {
              duration: 800,
              fill: 'forwards',
              easing: 'ease-in'
            });
          }
        });

        // Animate logos flying UP (except NFL)
        allLogos.forEach(logo => {
          if (logo.dataset.league !== 'nfl') {
            logo.animate([
              { transform: 'translate(0, 0)', opacity: 1 },
              { transform: 'translate(0, -120vh)', opacity: 0 }
            ], {
              duration: 800,
              fill: 'forwards',
              easing: 'ease-in'
            });
          }
        });

        setTimeout(() => {
          isAnimating = false;
        }, 800);

        return;
      }

      // Middle Phase: Switch to answer screen after numbers drop
      if (numbersAreDropped) {
        gameScreen.style.display = 'none';
        answerScreen.style.display = 'flex';
        return;
      }

      // Initial Phase: Handle 4 shuffles
      if (clickCount >= 4) return;

      clickCount++;
      isAnimating = true;

      const allSlots = Array.from(document.querySelectorAll('.logo-slot'));
      const allLogos = Array.from(document.querySelectorAll('.logo-img'));
      const nflLogo = document.querySelector('[data-league="nfl"]');

      // 1. Record exact starting positions
      const startPositions = new Map();
      allLogos.forEach(logo => {
        startPositions.set(logo, logo.getBoundingClientRect());
      });

      // 2. Isolate non-NFL slots and logos
      const nflSlotIndex = allSlots.findIndex(slot => slot.contains(nflLogo));
      const nonNflSlots = allSlots.filter((_, idx) => idx !== nflSlotIndex);
      const currentNonNflLogos = nonNflSlots.map(slot => slot.firstElementChild);

      // 3. Shuffle non-NFL logos so every single one moves to a NEW slot
      let shuffledLogos = [...currentNonNflLogos];
      let isValid = false;

      while (!isValid) {
        for (let i = shuffledLogos.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffledLogos[i], shuffledLogos[j]] = [shuffledLogos[j], shuffledLogos[i]];
        }
        isValid = shuffledLogos.every((logo, idx) => logo !== currentNonNflLogos[idx]);
      }

      // 4. Update DOM positions for non-NFL logos
      nonNflSlots.forEach((slot, idx) => {
        slot.appendChild(shuffledLogos[idx]);
      });

      // 5. Animate logos
      const animationDuration = 800; // ms
      const arcHeight = 180; // px

      allLogos.forEach(logo => {
        if (logo === nflLogo) {
          // NFL jumps strictly vertical
          logo.animate([
            { transform: 'translate(0px, 0px)', easing: 'ease-out' },
            { transform: `translate(0px, -${arcHeight}px)`, easing: 'ease-in' },
            { transform: 'translate(0px, 0px)' }
          ], {
            duration: animationDuration,
            fill: 'both'
          });
        } else {
          // Other logos fly along dynamic curved arcs to their new slots
          const oldRect = startPositions.get(logo);
          const newRect = logo.getBoundingClientRect();

          const deltaX = oldRect.left - newRect.left;
          const deltaY = oldRect.top - newRect.top;

          logo.animate([
            { transform: `translate(${deltaX}px, ${deltaY}px)`, easing: 'ease-out' },
            { transform: `translate(${deltaX / 2}px, ${deltaY / 2 - arcHeight}px)`, easing: 'ease-in' },
            { transform: 'translate(0, 0)' }
          ], {
            duration: animationDuration,
            fill: 'both'
          });
        }
      });

      // Unlock clicking after jump animation finishes
      setTimeout(() => {
        isAnimating = false;

        // 6. Check if 4th click was reached
        if (clickCount === 4) {
          // Wait 2 seconds, then drop numbers from top
          setTimeout(() => {
            dropNumbers();
          }, 2000);
        }
      }, animationDuration);
    });

    // Function to drop numbers 1-6 down above the logos
    function dropNumbers() {
      const numbers = document.querySelectorAll('.number-img');
      numbers.forEach((numImg, idx) => {
        setTimeout(() => {
          numImg.classList.add('dropped');
        }, idx * 100);
      });

      // Enable the next screen trigger once numbers finish dropping
      setTimeout(() => {
        numbersAreDropped = true;
      }, 1000);
    }
  </script>

</body>
</html>
